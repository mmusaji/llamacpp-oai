<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center</title>
  <meta name="description" content="C3 Command Center — Centralized AI command, control, and coordination. Direct autonomous AI units in real time.">
  <meta property="og:title" content="C3 Command Center">
  <meta property="og:description" content="Centralized AI command, control, and coordination. Direct autonomous AI units in real time from a single tactical interface.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="C3 Command Center">
  <meta name="twitter:description" content="Centralized AI command, control, and coordination. Direct autonomous AI units in real time from a single tactical interface.">
  <meta name="theme-color" content="#00ff41">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=brief3">
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen">
    <div class="login-container">
      <div class="login-header">
        <div class="login-emblem"><span>CC</span></div>
        <div class="login-title">Command Center</div>
        <div class="login-subtitle">Secure AI Operations</div>
      </div>
      <div class="login-panel">
        <div class="login-field">
          <label>Access Code</label>
          <input type="password" id="login-password" placeholder="Enter verification code" autocomplete="off">
        </div>
        <button class="login-btn" id="login-btn">Authenticate</button>
        <div class="login-status" id="login-status"></div>
      </div>
      <div class="login-footer">CLASSIFICATION: TOP SECRET</div>
    </div>
  </div>

  <!-- App Screen -->
  <div class="app-screen">
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" title="Toggle sidebar">&#9776;</button>
        <div class="top-bar-logo">COMMAND CENTER</div>
        <div class="top-bar-divider"></div>
        <div class="top-bar-status" id="model-count">--</div>
      </div>
      <div class="top-bar-right">
        <button class="btn-logout" id="btn-logout">DISCONNECT</button>
      </div>
    </div>

    <div class="app-body">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">AI Units</span>
          <button class="btn-refresh" id="btn-refresh" title="Refresh">&#8635;</button>
        </div>
        <div class="model-list" id="model-list"></div>
        <div class="sidebar-footer">AUTO-REFRESH: 30S</div>
      </div>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- Chat -->
      <div class="chat-area">
        <div class="chat-header">
          <div class="chat-target" id="chat-target">NO UNIT SELECTED</div>
          <div class="chat-actions">
            <button class="btn-directive" id="btn-directive" style="display:none">DIRECTIVE</button>
            <button class="btn-clear" id="btn-clear">CLEAR</button>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="no-model-selected">SELECT A UNIT TO BEGIN</div>
        </div>
        <div class="vision-feed" id="vision-feed" style="display:none">
          <div class="vision-stream-container">
            <img id="vision-stream" alt="Vision AI Stream">
            <div class="vision-overlay" id="vision-overlay">
              <div class="vision-status" id="vision-status">CONNECTING TO FEED...</div>
            </div>
          </div>
          <div class="vision-bar">
            <div class="vision-bar-left">
              <button class="btn-vision-upload" id="btn-vision-upload" title="Upload image or video">+</button>
              <span class="vision-label" id="vision-label">LIVE INFERENCE FEED</span>
            </div>
            <span class="vision-indicator" id="vision-indicator"></span>
          </div>
          <div class="vision-brief" id="vision-brief" style="display:none"></div>
        </div>
        <input type="file" id="vision-file-input" accept="image/*,video/mp4,video/avi,video/quicktime,video/x-msvideo,video/webm" hidden>
        <div class="chat-input-area" id="chat-input-area">
          <input type="file" id="file-input" multiple hidden>
          <div class="attachment-strip" id="attachment-strip"></div>
          <div class="chat-input-row">
            <button class="btn-attach" id="btn-attach" style="display:none" title="Attach file">+</button>
            <textarea class="chat-input" id="chat-input" placeholder="Enter transmission..." rows="1"></textarea>
            <button class="btn-send" id="btn-send">SEND</button>
            <button class="btn-stop" id="btn-stop" style="display:none">&#9632;</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Directive Editor Modal -->
  <div class="directive-overlay" id="directive-overlay">
    <div class="directive-modal">
      <div class="directive-header">
        <span class="directive-title">UNIT DIRECTIVE</span>
        <button class="directive-close" id="directive-close">&times;</button>
      </div>
      <div class="directive-hint">System prompt prepended to all transmissions for this unit.</div>
      <textarea class="directive-input" id="directive-input" rows="6" placeholder="Enter system directive..."></textarea>
      <div class="directive-footer">
        <button class="directive-reset" id="directive-reset">RESET DEFAULT</button>
        <button class="directive-save" id="directive-save">SAVE</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=brief3"></script>
</body>
</html>
