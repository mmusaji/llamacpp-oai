---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: command-center
  namespace: sovereign-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: command-center-isvc-reader
  namespace: sovereign-ai
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: command-center-isvc-reader
  namespace: sovereign-ai
subjects:
  - kind: ServiceAccount
    name: command-center
    namespace: sovereign-ai
roleRef:
  kind: Role
  name: command-center-isvc-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-center
  namespace: sovereign-ai
  labels:
    app: command-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command-center
  template:
    metadata:
      labels:
        app: command-center
    spec:
      serviceAccountName: command-center
      containers:
        - name: web
          # mission-v2 (fedora watch) — pin digest so Git/Argo match the registry bit-for-bit
          image: image-registry.openshift-image-registry.svc:5000/sovereign-ai/command-center@sha256:9b1502f3d24bec3f76d3295211cd2849f01b612f4e40dc079aac6703058df0a6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: COMMAND_PASSWORD
              value: "commander"
            - name: NAMESPACE
              value: "sovereign-ai"
            - name: VISION_AI_URL
              value: http://vision-ai-yolox.sovereign-ai.svc.cluster.local:8080
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: command-center
  namespace: sovereign-ai
spec:
  selector:
    app: command-center
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: command-center
  namespace: sovereign-ai
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: command-center
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
