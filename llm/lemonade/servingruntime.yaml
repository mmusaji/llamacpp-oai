apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: llamacpp-lemonade
  namespace: sovereign-ai
  annotations:
    opendatahub.io/recommended-accelerators: '["amd.com/gpu"]'
    opendatahub.io/runtime-version: (experiment-lemonade-rocm)
    openshift.io/display-name: llama.cpp (lemonade-rocm)
  labels:
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
    opendatahub.io/kserve-runtime: "true"
  builtInAdapter:
    memBufferBytes: 134217728
    modelLoadingTimeoutMillis: 900000
  supportedModelFormats:
    - name: gguf
      autoSelect: true
  containers:
    - name: kserve-container
      image: quay.io/jgoh/llamacpp:experiment_lemonade-rocm
      imagePullPolicy: Always
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
          amd.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          amd.com/gpu: "1"
      # securityContext:
      #   allowPrivilegeEscalation: false
      #   capabilities:
      #     drop:
      #       - ALL
      #   runAsNonRoot: true