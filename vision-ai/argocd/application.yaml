apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vision-ai-yolox
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/mmusaji/llamacpp-oai.git
    targetRevision: main
    path: vision-ai/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sovereign-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
