apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: yolo26-seg
  namespace: sovereign-ai
  annotations:
    modelFormat: onnx
    opendatahub.io/connection-path: /models/yolo26n-seg.onnx
    opendatahub.io/connections: models-odf-s3
    opendatahub.io/hardware-profile-name: default-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: object-detection
    openshift.io/display-name: "YOLO26n Segmentation"
    openshift.io/description: "YOLO26n-seg ONNX model with end-to-end head for real-time object detection and segmentation (COCO 80 classes)"
    security.opendatahub.io/enable-auth: "true"
    serving.kserve.io/deploymentMode: Standard
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: Recreate
    maxReplicas: 1
    minReplicas: 0
    model:
      modelFormat:
        name: onnx
      name: ""
      protocolVersion: v2
      resources:
        requests:
          cpu: "4"
          memory: 4Gi
        limits:
          cpu: "8"
          memory: 8Gi
      runtime: onnxruntime-cpu
      # Use PVC-backed storage for the ONNX model to avoid relying on an
      # external MinIO image that may not be pullable in air-gapped demos.
      # The model file is expected at /models/yolo26n-seg.onnx inside the
      # yolo26-models PVC.
      storageUri: pvc://yolo26-models/yolo26n-seg.onnx
    serviceAccountName: models-odf-s3-sa
    timeout: 300
