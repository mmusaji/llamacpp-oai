apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vision-ai-isvc-access
  namespace: sovereign-ai
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vision-ai-isvc-access
  namespace: sovereign-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vision-ai-isvc-access
subjects:
  - kind: ServiceAccount
    name: models-odf-s3-sa
    namespace: sovereign-ai
