apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-ai-yolox
  namespace: sovereign-ai
  labels:
    app: vision-ai-yolox
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: vision-ai-yolox
  template:
    metadata:
      labels:
        app: vision-ai-yolox
    spec:
      serviceAccountName: models-odf-s3-sa
      containers:
        - name: vision-ai-yolox
          image: image-registry.openshift-image-registry.svc:5000/sovereign-ai/visionai-app:latest
          imagePullPolicy: Always
          env:
            - name: INFERENCE_ENDPOINTS
              value: "yolo26=yolo26-grpc.sovereign-ai.svc.cluster.local:8001,yolo26-seg=yolo26-seg-grpc.sovereign-ai.svc.cluster.local:8001"
            - name: MODEL_NAME
              value: model
            - name: RTSP_URL
              valueFrom:
                secretKeyRef:
                  name: rtsp-credentials
                  key: RTSP_URL
            - name: CONF_THRESHOLD
              value: "0.15"
            - name: INPUT_SIZE
              value: "832"
            - name: UNDISTORT_K1
              value: "0"
            - name: EXCLUDED_CLASSES
              value: "bicycle,traffic light,fire hydrant,stop sign,parking meter,refrigerator,tv,baseball bat,baseball glove,surfboard,boat,truck"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vision-ai-yolox
  namespace: sovereign-ai
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: vision-ai-yolox
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vision-ai-yolox
  namespace: sovereign-ai
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: vision-ai-yolox
