apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: yolo26
  namespace: sovereign-ai
  annotations:
    modelFormat: onnx
    opendatahub.io/connection-path: /models/yolo26m.onnx
    opendatahub.io/connections: models-odf-s3
    opendatahub.io/hardware-profile-name: cpu-only
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: object-detection
    openshift.io/display-name: "YOLO26m Detection"
    openshift.io/description: "YOLO26m ONNX model with end-to-end head for real-time object detection (COCO 80 classes)"
    security.opendatahub.io/enable-auth: "true"
    serving.kserve.io/deploymentMode: Standard
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: Recreate
    maxReplicas: 1
    minReplicas: 0
    model:
      modelFormat:
        name: onnx
      name: ""
      protocolVersion: v2
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
      # Stays on CPU: the Radeon 890M iGPUs cannot initialize hipblaslt for this
      # model (HIP OOM), and the image has no MIGraphX provider. Pairing with the
      # cpu-only profile avoids reserving a GPU this model cannot use.
      runtime: onnxruntime-cpu
      storage:
        key: models-odf-s3
        path: /models/yolo26m.onnx
    serviceAccountName: models-odf-s3-sa
    timeout: 300
