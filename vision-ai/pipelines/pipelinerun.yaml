apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: vision-ai-yolox-build-
  namespace: sovereign-ai-ci
spec:
  pipelineRef:
    name: vision-ai-yolox-build
  timeouts:
    pipeline: "6h"
    tasks: "120m"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: ocs-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 20Gi
    - name: registry-creds
      secret:
        secretName: quay-push-secret
