apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
  namespace: sovereign-ai-ci
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: vision-ai-yolox-build-template
  namespace: sovereign-ai-ci
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: vision-ai-yolox-build-
        namespace: sovereign-ai-ci
      spec:
        pipelineRef:
          name: vision-ai-yolox-build
        timeouts:
          pipeline: "6h"
          tasks: "120m"
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: ocs-storagecluster-ceph-rbd
                resources:
                  requests:
                    storage: 20Gi
          - name: registry-creds
            secret:
              secretName: quay-push-secret
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-listener
  namespace: sovereign-ai-ci
spec:
  serviceAccountName: pipeline
  triggers:
    # vision-ai-build-template is declared on the experiment/vision-ai branch, not in
    # this file. Both triggers share this EventListener, so dropping either one here
    # removes it from the cluster on the next apply.
    - name: github-push
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: body.ref == 'refs/heads/experiment/vision-ai'
      bindings:
        - ref: github-push-binding
      template:
        ref: vision-ai-build-template
    - name: main-push
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: body.ref == 'refs/heads/main'
      bindings:
        - ref: github-push-binding
      template:
        ref: vision-ai-yolox-build-template
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: github-webhook
  namespace: sovereign-ai-ci
spec:
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: el-github-listener
